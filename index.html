<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精選影片作品首頁</title>
  <style>
    
    /* 導覽列 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      z-index: 1000;
    }

    .logo {
      font-size: 1.2rem;
      line-height: 40px;
      height: 40px;
      color: white;
      font-weight: bold;
      font-family: 'Noto Sans TC', sans-serif;
      letter-spacing: 0.3em;
      animation: slideIn 0.8s ease forwards;
      opacity: 0;
      transform: translateX(-100%);
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-size: 0.9rem;
      font-family: 'Noto Sans TC', sans-serif;
      letter-spacing: 0.15em;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #ccc;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .hamburger div {
      width: 25px;
      height: 2px;
      background: white;
      transition: all 0.3s ease;
    }

    .mobile-menu {
      position: absolute;
      top: 100%;
      right: 0;
      background: rgba(0, 0, 0, 0.85);
      flex-direction: column;
      width: 100%;
      text-align: right;
      padding: 1.5rem 2rem;
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      transition: all 0.4s ease;
    }

    .mobile-menu.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .mobile-menu a {
      padding: 1rem 0;
      text-decoration: none;
      color: white;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.15em;
      transition: color 0.3s ease;
    }

    .mobile-menu a:hover {
      color: #ccc;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
      .hamburger {
        display: flex;
      }
    }

    
    /* 基本 reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: sans-serif;
    }

    .video-section {
      position: relative;
      width: 100%;
      height: 100vh; /* 滿螢幕高度 */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .video-section video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 保持影片比例，覆蓋滿屏 */
      z-index: 1;
    }

    .overlay-text {
      position: absolute;
      z-index: 2;
      color: white;
      font-size: 2rem;
      text-align: center;
      padding: 1rem;
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

<!-- 導覽列 --> 
<nav class="navbar"> 
<div class="logo">PORTFOLIO</div>
 <div class="nav-links">
 <a href="index.html">HOME</a> 
<a href="work.html">WORK</a>
 <a href="about.html">ABOUT</a> 
</div> 
<div class="hamburger" onclick="toggleMenu()"> 
<div></div> 
<div></div>
 <div></div>
 </div> 
<div class="mobile-menu" id="mobileMenu">
 <a href="index.html">HOME</a> 
<a href="work.html">WORK</a>
 <a href="about.html">ABOUT</a> 
</div> 
</nav>

  
  <!-- 範例影片區塊 -->
  <section class="video-section">
    <video src="index/video/S台灣瑪摩 雙橡園家居 TAID 55週年影片.mp4" muted loop playsinline></video>
    <div class="overlay-text"></div>
  </section>

  <section class="video-section">
    <video src="index/video/S台灣瑪摩 雙橡園家居 TAID 55週年影片.mp4" muted loop playsinline></video>
    <div class="overlay-text">作品名稱或簡短引言 2</div>
  </section>

  <section class="video-section">
    <video src="video3.mp4" muted loop playsinline></video>
    <div class="overlay-text">作品名稱或簡短引言 3</div>
  </section>

  
  <script>
        // 控制漢堡選單
    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('show');
    }
    
    // 使用 Intersection Observer 控制滑入播放 / 滑出暫停
    const videos = document.querySelectorAll('video');

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.play();
        } else {
          entry.target.pause();
        }
      });
    }, { threshold: 0.5 }); // 影片 50% 進入畫面才播放

    videos.forEach(video => observer.observe(video));
  </script>
</body>
</html>
