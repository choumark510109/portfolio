<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精選影片作品首頁</title>
  <style>
    /* 基本 reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: sans-serif;
    }

    .video-section {
      position: relative;
      width: 100%;
      height: 100vh; /* 滿螢幕高度 */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .video-section video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 保持影片比例，覆蓋滿屏 */
      z-index: 1;
    }

    .overlay-text {
      position: absolute;
      z-index: 2;
      color: white;
      font-size: 2rem;
      text-align: center;
      padding: 1rem;
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

  <!-- 範例影片區塊 -->
  <section class="video-section">
    <video src="video1.mp4" muted loop playsinline></video>
    <div class="overlay-text">作品名稱或簡短引言 1</div>
  </section>

  <section class="video-section">
    <video src="video2.mp4" muted loop playsinline></video>
    <div class="overlay-text">作品名稱或簡短引言 2</div>
  </section>

  <section class="video-section">
    <video src="video3.mp4" muted loop playsinline></video>
    <div class="overlay-text">作品名稱或簡短引言 3</div>
  </section>

  <script>
    // 使用 Intersection Observer 控制滑入播放 / 滑出暫停
    const videos = document.querySelectorAll('video');

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.play();
        } else {
          entry.target.pause();
        }
      });
    }, { threshold: 0.5 }); // 影片 50% 進入畫面才播放

    videos.forEach(video => observer.observe(video));
  </script>
</body>
</html>
