<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHOU MARCUS Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      font-family: 'Noto Sans TC', sans-serif;
      background: #000;
      color: white;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('images/images/home/remix.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      opacity: 0.18;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      z-index: 1000;
    }

    .logo {
      font-size: 1.2rem;
      line-height: 40px;
      height: 40px;
      color: white;
      font-weight: bold;
      letter-spacing: 0.3em;
      animation: fadeInLeft 1s ease forwards;
      opacity: 0;
    }

    @keyframes fadeInLeft {
      0% { transform: translateX(-30%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards;
      animation-delay: 0.6s;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      transition: color 0.3s ease;
    }

    .nav-links a:hover { color: #aaa; }

    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
    .hamburger div { width: 25px; height: 2px; background: white; transition: all 0.3s ease; }

    .mobile-menu {
      position: absolute;
      top: 100%; right: 0;
      background: rgba(0, 0, 0, 0.85);
      flex-direction: column;
      width: 100%;
      text-align: right;
      padding: 1.5rem 2rem;
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
      display: flex;
      transition: all 0.4s ease;
    }
    .mobile-menu.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .mobile-menu a {
      padding: 1rem 0;
      text-decoration: none;
      color: white;
      font-size: 1rem;
      letter-spacing: 0.15em;
      transition: color 0.3s ease;
    }
    .mobile-menu a:hover { color: #aaa; }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
    }

    /* 影片區塊 */
    .video-section {
      width: 100vw;
      height: 56vw;
      max-height: 600px;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      position: relative;
      overflow: hidden;
    }
    .video-section video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
      outline: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      background: black;
    }

    .about-content {
      max-width: 900px;
      margin: 60px auto 0;
      padding: 0 2rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2.5rem;
      text-align: left;
    }

    .about-block {
      background: rgba(255,255,255,0.08);
      /* 取消毛玻璃效果 */
      /* backdrop-filter: blur(10px); */
      /* -webkit-backdrop-filter: blur(10px); */
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.13);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      padding: 2.5rem 2rem;
      margin-bottom: 2.5rem;
      width: 100%;
      text-align: left;
    }

    .about-block h1, .about-block h2, .about-block h3 {
      font-family: 'Playfair Display', serif;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      color: #fff;
      text-align: left;
    }
    .about-block h1 { font-size: 1rem; } /* 2.2rem / 8 = 0.275rem */
    .about-block h2 { font-size: 0.5rem; opacity: 0.8; } /* 1.2rem / 8 = 0.15rem */
    .about-block h3 { font-size: 0.5rem; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 0.5rem; }

    .about-block p, .about-block ul {
      font-size: 1rem; /* 1rem / 8 = 0.125rem */
      letter-spacing: 0.05em;
      line-height: 2;
      color: #fff;
      opacity: 0.93;
      text-align: left;
    }
    .about-block ul { margin-top: 1.2rem; margin-bottom: 1.2rem; }
    .about-block ul li { margin-bottom: 0.7rem; text-align: left; }

    .email {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      letter-spacing: 0.15em;
      opacity: 0.9;
      margin-top: 2rem;
      text-align: left;
    }
    .company { font-weight: 600; letter-spacing: 0.12em; }
    .title { font-weight: 400; opacity: 0.8; letter-spacing: 0.08em; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 768px) {
      .about-content { padding: 0 1rem; }
      .about-block { padding: 2rem 1rem; }
      .video-section { height: 55vw; min-height: 180px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">PORTFOLIO</div>
    <div class="nav-links">
      <a href="index.html">HOME</a>
      <a href="work.html">WORK</a>
      <a href="about.html">ABOUT</a>
    </div>
    <div class="hamburger" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">HOME</a>
      <a href="work.html">WORK</a>
      <a href="about.html">ABOUT</a>
    </div>
  </nav>

  <!-- 影片區塊 -->
  <section class="video-section" data-aos="fade-up">
    <video src="personalvideo2.mp4" autoplay loop muted playsinline></video>
  </section>

  <div class="about-content">
    <div class="about-block" data-aos="fade-up" data-aos-delay="100">
      <h1>奢侈品顧問Ⅹ故事創作｜構築品牌視覺靈魂</h1>
      <h2>Brand marketing strategist with experience at luxury powerhouse Louis Vuitton,<br>dedicated to mastering aesthetic visual presentation.</h2>
      <p>
        品牌行銷規劃，結合奢侈品龍頭 Louis Vuitton 工作經驗，致力於掌握美學視覺呈現。<br>
      </p>
      <p>
        影音創作｜內容創作｜平面設計｜企劃發想
      </p>
    </div>
      <p class="email">marks10820007@gmail.com</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ once: true, duration: 1000, easing: 'ease-out' });
    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('show');
    }
  </script>
</body>
</html>
